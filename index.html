<!doctype html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1311">
  <meta name="color-scheme" content="dark light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Strozzi">
  <meta name="robots" content="noindex, nofollow">
  <title>Studio Strozzi · Agenda</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script>
    // tema prima del primo disegno (niente lampo bianco)
    try {
      var p = JSON.parse(localStorage.getItem("strozzi.theme") || '"system"');
      var t = p === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : p;
      document.documentElement.dataset.theme = t;
      document.querySelector('meta[name="theme-color"]').setAttribute("content", t === "dark" ? "#0f1311" : "#f2f1ec");
    } catch (e) {}
  </script>
  <script src="js/config.js"></script>
  <script src="vendor/supabase.js"></script>
</head>
<body>
  <div id="boot" class="boot"><div class="logo"></div></div>
  <div id="root"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
